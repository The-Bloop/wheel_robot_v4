name: Testing Merge Workflow.

on:
  issue_comment:
    types: [created]

jobs:
  testing-merge:
    if: github.event.issue.pull_request != null && github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Check for comment
        id: check_comment
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TRIGGER_COMMENT="tos"
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENT=$(gh pr view $PR_NUMBER --json comments --jq '.comments[].body')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR Comment: $COMMENT"
          COMMENT_LOWER=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]')
          if [[ "$COMMENT_LOWER" != *"$TRIGGER_COMMENT"* ]]; then
            echo "This PR will not be tested."
            echo "should_test=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "This PR will be tested."
            echo "should_test=true" >> $GITHUB_OUTPUT
            exit 0
          fi
