name: Testing Merge Workflow.

on:
  pull_request:
    branches: 
      - main
    types: [closed]

jobs:
  testing-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Check for comment
        id: check_comment
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TRIGGER_COMMENT="tos"
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMENT=$(gh pr view $PR_NUMBER --json comments --jq '.comments[].body')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR Comment: $COMMENT"
          COMMENT_LOWER=$(echo "$COMMENT" | tr '[:upper:]' '[:lower:]')
          if [[ "$COMMENT_LOWER" != *"$TRIGGER_COMMENT"* ]]; then
            echo "This PR will not be tested."
            echo "should_test=false" >> $GITHUB_OUTPUT  
          else
            echo "This PR will be tested."
            echo "should_test=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Revert merge on failure
        if: steps.check_comment.outputs.should_test == 'false'
        run: |
          echo "❌ Tests failed! Reverting merge..."
          
          # Configure git
          git config user.name "The-Bloop"
          git config user.email "ssabariis@gmail.com"
          
          # Revert the merge commit
          MERGE_COMMIT=${{ github.event.pull_request.merge_commit_sha }}
          git revert -m 1 $MERGE_COMMIT --no-edit
          
          # Push the revert
          git push origin main
          
          # Comment on PR
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ Merge reverted due to test failures. Please fix and re-merge."
